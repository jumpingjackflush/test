<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>山手線・中央線 クリック塗りアプリ (完全統合版)</title>
  <style>
    /* 画面全体を埋める設定 */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      overflow: hidden; /* スクロールバーを消す */
      display: flex;    /* 縦並びのレイアウト */
      flex-direction: column;
    }

    /* ツールバー*/
    #toolbar {
      padding: 10px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0; 
      z-index: 10;
    }

    /* キャンバス*/
    #map { 
      flex-grow: 1;
      display: block;
      background: #f8f8f8; 
      cursor: pointer;
      user-select: none;
      width: 100%;
      height: 100%;
    }
    
    .stat { font-size: 14px; color: #333; margin-left: 10px; }
    
    button { padding: 6px 12px; border: 1px solid #aaa; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background:#e8e8e8; }
  </style>
</head>
<body>
  
  <div id="toolbar">
    <button id="saveBtn">保存</button>
    <button id="loadBtn">読込</button>
    <button id="clearBtn">全解除</button>
    <button id="resetBtn">視点リセット</button>
    
    <button id="bgBtn">背景画像</button>

    <span class="stat">塗った区間: <span id="count">0</span> / <span id="total">0</span></span>
  </div>

  <input type="file" id="bgInput" accept="image/*" style="display: none;">
  <input type="file" id="imageInput" accept="image/*" style="display: none;">

  <canvas id="map"></canvas>

    let defaultX = 0; // 画面中央のX座標（レスポンシブ用に0初期化）

    // レスポンシブ対応のため、極座標は原点(0,0)基準で返す
    function polar(angle, radius) {
      return { x: radius * Math.cos(angle), y: radius * Math.sin(angle) };
    }

    // データ構造 
    const stationFigure = new Map();
    // 山手線
    for (let i = 0; i < N; i++) {
      const theta = (-Math.PI/2) + i * (2*Math.PI/N);
      const p = polar(theta, R);
      const station = { id:i, name: yamanote[i], x:p.x, y:p.y, angle: theta };
      stationFigure.set(station.name, station);
    }
    const allStations = Array.from(stationFigure.values());

    const yamanoteEdges = [];
    for (let i = 0; i < N; i++) {
      const j = (i+1) % N;
      yamanoteEdges.push({

      const newEdges = [];
      for (const stationInfo of stationData) {
        const startStation = stationFigure.get(stationInfo.start);
        if (!startStation) {
          console.error(`始点駅 "${stationInfo.start}" が見つかりません。`);
          continue; 
        }
        const newStation = {
          id: newId,
          name: stationInfo.name,
          x: startStation.x + stationInfo.dx,
          y: startStation.y + stationInfo.dy,
          angle: null,
        };
        allStations.push(newStation);
        stationFigure.set(newStation.name, newStation);
        newEdges.push({
          from: startStation.id,
          to: newStation.id,
          active: false,
          color: defaultColor,
          activeColor: activeColor
        });
        newId++;
      }
      return newEdges;
    }

    const jobanEdges = addStationsAndEdges(jobanData);
    const takasakiEdges = addStationsAndEdges(takasakiData);
    const utunomiyaEdges = addStationsAndEdges(utunomiyaData);
    const nanbuEdges = addStationsAndEdges(nanbuData);

    const allEdges = [...yamanoteEdges, ...keihinEdges, ...chuosobuEdges,
                       ...musasinoEdges,　...sobuEdges,  ...saikyoEdges,
                       ...takasakiEdges, ...jobanEdges, ...utunomiyaEdges,
                       ...nanbuEdges];
    
    // 追加の接続
    connectStations("御茶ノ水","神田");
    connectStations("御茶ノ水","秋葉原");
    connectStations("武蔵浦和","南浦和");
    connectStations("八丁堀","東京");
    connectStations("十条","赤羽");
    connectStations("北戸田","武蔵浦和");
    connectStations("北与野","大宮");
    connectStations("南千住","北千住");
    connectStations("分倍河原","府中本町");
    connectStations("尻手","川崎");
    connectStations("下総中山","西船橋");


    // 範囲選択
    let pendingRangeStartEdge = null; 

    function buildAdjacencyList() {
      const adj = new Map();
      allStations.forEach(s => adj.set(s.id, []));
      allEdges.forEach(edge => {
        adj.get(edge.from).push({ to: edge.to, edgeObj: edge });
        adj.get(edge.to).push({ to: edge.from, edgeObj: edge });
      });
      return adj;
    }

    function findPathBetweenEdges(edgeA, edgeB) {
      if (edgeA === edgeB) return [edgeA];
      const adj = buildAdjacencyList();
      const startNodes = [edgeA.from, edgeA.to];
      const goalNodes = new Set([edgeB.from, edgeB.to]);
      let bestPath = null;

      for (const startNode of startNodes) {
        const queue = [{ node: startNode, path: [] }];
        const visited = new Set([startNode]);
        while (queue.length > 0) {
          const { node, path } = queue.shift();
          if (goalNodes.has(node)) {
            const fullPath = [edgeA, ...path, edgeB];
            if (!bestPath || fullPath.length < bestPath.length) {
              bestPath = fullPath;
            }
            break; 
          }
          const neighbors = adj.get(node) || [];
          for (const next of neighbors) {
            if (!visited.has(next.to)) {
              visited.add(next.to);
              queue.push({ node: next.to, path: [...path, next.edgeObj] });
            }
          }
        }
      }
      return bestPath || [];
    }

    // 描画
    function draw() {
      ctx.save();
      ctx.clearRect(0,0, canvas.width, canvas.height);
      
      ctx.setTransform(scale, 0, 0, scale, defaultX, defaultY);

      // 背景画像
      if (bgImageObj) {
        const bx = -bgImageObj.width / 2;
        const by = -bgImageObj.height / 2;
        ctx.drawImage(bgImageObj, bx, by);
      }

      // 山手線の円
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI*2);
      ctx.strokeStyle = "#e0e0e0";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 辺
      allEdges.forEach(e => {
        const a = allStations[e.from], b = allStations[e.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        
        if (e === pendingRangeStartEdge) {
          // 範囲選択中はシアン
          ctx.strokeStyle = "#00ffff"; 
        } else {
          ctx.strokeStyle = e.active ? e.activeColor : e.color;
        }
        ctx.stroke();
      });

      // 駅
      allStations.forEach(s => {
        ctx.beginPath();
        // 画像がある場合は黄色
        ctx.fillStyle = s.image ? "#ffeb3b" : "#fff"; 
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.arc(s.x, s.y, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
      });

      // 文字
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillStyle = "#111";
      ctx.textBaseline = "middle";
      
      allStations.forEach(s => {
        if (s.angle !== null) {
          const label = polar(s.angle, labelR);
          const deg = ((s.angle*180/Math.PI)+360)%360;
          if (deg > 90 && deg < 270) {
            ctx.textAlign = "right";
          } else {
            ctx.textAlign = "left";
          }
          ctx.fillText(s.name, label.x, label.y);
        } else {
          ctx.textAlign = "center";
          ctx.fillText(s.name, s.x, s.y - 15);
        }
      });

      document.getElementById("count").textContent = allEdges.filter(e=>e.active).length;
      document.getElementById("total").textContent = allEdges.length;

      ctx.restore();
    }

    // 座標変換
    function screenToWorld(sx, sy) {
      return { x: (sx - defaultX) / scale, y: (sy - defaultY) / scale };
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const vx = x2 - x1, vy = y2 - y1;
      const wx = px - x1, wy = py - y1;
      const c1 = vx*wx + vy*wy;
      if (c1 <= 0) return Math.hypot(px - x1, py - y1);
      const c2 = vx*vx + vy*vy;
      if (c2 <= c1) return Math.hypot(px - x2, py - y2);
      const t = c1 / c2;
      const projx = x1 + t*vx, projy = y1 + t*vy;
      return Math.hypot(px - projx, py - projy);
    }

    function getStationAt(worldX, worldY) {
      const hitRadius = 10; 
      for (const s of allStations) {
        const dist = Math.hypot(worldX - s.x, worldY - s.y);
        if (dist <= hitRadius) { return s; }
      }
      return null;
    }

    // リサイズ
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      if (defaultX === 0 && defaultY === 0) {
         resetView();
      }
      draw();
    }

    function resetView() {
      scale = 1.0;
      defaultX = canvas.width / 2;
      defaultY = canvas.height / 2;
      draw();
    }

    window.addEventListener("resize", () => {
      const oldW = canvas.width;
      const oldH = canvas.height;
      resizeCanvas();
      if (oldW && oldH) {
        defaultX += (canvas.width - oldW) / 2;
        defaultY += (canvas.height - oldH) / 2;
      }
      draw();
    });

    // 背景画像設定
    const bgBtn = document.getElementById("bgBtn");
    const bgInput = document.getElementById("bgInput");
    let bgImageObj = null;

    bgBtn.onclick = () => { bgInput.click(); };
    
    bgInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          bgImageObj = img;
          draw();
          alert("背景画像を設定しました");
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      bgInput.value = ""; 
    });

    // 駅画像設定
    const imageInput = document.getElementById("imageInput");
    let targetStationIdForUpload = null; 

    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || targetStationIdForUpload === null) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const station = allStations[targetStationIdForUpload];
        station.image = evt.target.result;
        alert(`${station.name}駅に写真を設定しました！`);
        draw();
      };
      reader.readAsDataURL(file);
      imageInput.value = ""; 
    });

    // 右クリック (範囲選択)
    canvas.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const world = screenToWorld(screenX, screenY);

      let bestEdge = null;
      let bestDist = Infinity;
      allEdges.forEach((e) => {
        const a = allStations[e.from], b = allStations[e.to];
        const d = pointToSegmentDistance(world.x, world.y, a.x, a.y, b.x, b.y);
        if (d < bestDist) {
          bestDist = d;
          bestEdge = e;
        }
      });

      if (bestEdge && (bestDist * scale) <= 12) {
        if (pendingRangeStartEdge === null) {
          pendingRangeStartEdge = bestEdge;
          draw();
        } else {
          const pathEdges = findPathBetweenEdges(pendingRangeStartEdge, bestEdge);
          if (pathEdges.length > 0) {
            pathEdges.forEach(e => e.active = true);
          } else {
            alert("経路が見つかりませんでした");
          }
          pendingRangeStartEdge = null;
          draw();
        }
      } else {
        if (pendingRangeStartEdge) {
          pendingRangeStartEdge = null;
          draw();
        }
      }
    });

    // 左クリック (塗る・画像アップ)
    canvas.addEventListener("click", (ev) => {
      if (didDrag) { didDrag = false; return; }
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const world = screenToWorld(screenX, screenY);

      // Shift + Click で画像操作
      if (ev.shiftKey) {
        const station = getStationAt(world.x, world.y);
        if (station) {
          if (station.image) {
            const shouldDelete = confirm(`「${station.name}」には既に写真があります。\n\n削除しますか？\n(OK=削除 / キャンセル=新しい写真に変更)`);
            if (shouldDelete) {
              delete station.image; 
              draw(); 
              alert("画像を削除しました。");
              return; 
            }
          }
          targetStationIdForUpload = station.id;
          imageInput.click(); 
          return; 
        }
      }

      // 通常クリック (線を塗る)
      let bestEdge = null;
      let bestDist = Infinity;
      allEdges.forEach((e) => {
        const a = allStations[e.from], b = allStations[e.to];
        const d = pointToSegmentDistance(world.x, world.y, a.x, a.y, b.x, b.y);
        if (d < bestDist) {
          bestDist = d;
          bestEdge = e;
        }
      });
      if (bestEdge && (bestDist * scale) <= 12) {
        bestEdge.active = !bestEdge.active;
        draw();
      }
    });

    // マウスホイール (ズーム)
    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const worldBefore = screenToWorld(screenX, screenY);

      const zoomFactor = 1.1;
      let newScale = (ev.deltaY < 0) ? (scale * zoomFactor) : (scale / zoomFactor);
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

      scale = newScale;
      defaultX = screenX - worldBefore.x * scale;
      defaultY = screenY - worldBefore.y * scale;
      draw();
    });

    // ドラッグ & ホバー
    const imagePopup = document.getElementById("imagePopup");
    const popupImg = document.getElementById("popupImg");
    const popupTitle = document.getElementById("popupTitle");

    canvas.addEventListener("mousedown", (ev) => {
      nowDrag = true; didDrag = false;
      lastX = ev.clientX; lastY = ev.clientY;
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener("mousemove", (ev) => {
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;

      if (nowDrag) {
        ev.preventDefault();
        didDrag = true;
        const dx = ev.clientX - lastX;
        const dy = ev.clientY - lastY;
        defaultX += dx;
        defaultY += dy;
        lastX = ev.clientX;
        lastY = ev.clientY;
        draw();
        imagePopup.style.display = "none";
        return; 
      }

      // ホバー処理
      const world = screenToWorld(screenX, screenY);
      const hoveredStation = getStationAt(world.x, world.y);

      if (hoveredStation && hoveredStation.image) {
        imagePopup.style.display = "block";
        imagePopup.style.left = (ev.clientX + 15) + "px";
        imagePopup.style.top = (ev.clientY + 15) + "px";
        popupImg.src = hoveredStation.image;
        popupTitle.textContent = hoveredStation.name;
      } else {
        imagePopup.style.display = "none";
      }
    });

    canvas.addEventListener("mouseup", () => { nowDrag = false; canvas.style.cursor = 'pointer'; });
    canvas.addEventListener("mouseleave", () => { nowDrag = false; canvas.style.cursor = 'pointer'; });

    // 保存/読込
    const STORAGE_KEY = "yamanote_chuo_edges_state_v2"; 
    document.getElementById("saveBtn").onclick = () => {
      const saveData = {
        edges: allEdges.map(e => e.active ? 1 : 0),
        images: {} 
      };
      allStations.forEach(s => { if (s.image) saveData.images[s.name] = s.image; });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
        alert("保存しました。");
      } catch (e) {
        alert("容量オーバーのため保存できませんでした。");
      }
    };

    document.getElementById("loadBtn").onclick = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        // 新データの読み込み
        if (data.edges) {
          data.edges.forEach((state, i) => { if(allEdges[i]) allEdges[i].active = !!state; });
        }
        if (data.images) {
          for (const [name, imgStr] of Object.entries(data.images)) {
            const s = stationFigure.get(name);
            if (s) s.image = imgStr;
          }
        }
        draw();
        alert("読み込みました。");
      } catch (e) {
        alert("読み込みに失敗しました。");
      }
    };
    
    document.getElementById("clearBtn").onclick = () => {
      allEdges.forEach(e => e.active = false);
      draw();
    };
    document.getElementById("resetBtn").onclick = resetView;

    // 初期化実行
    resizeCanvas();
    resetView();
  </script>
</body>
</html>
