    #map { 
      border: 1px solid #bbb;
      background:#f8f8f8;
      cursor: pointer;
      border-radius: 8px; 
      user-select: none;
    }
    .stat { font-size: 14px; color: #333; }
    button { padding: 6px 12px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
    button:hover { background:#f0f0f0; }
  </style>
</head>

    // xy座標に変換
    function polar(angle, radius) {
      return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
    }

    // データ構造 
    const stationFigure = new Map();
    for (let i = 0; i < N; i++) {
      const theta = (-Math.PI/2) + i * (2*Math.PI/N);
      const p = polar(theta, R);
      const station = { id:i, name: yamanote[i], x:p.x, y:p.y, angle: theta };
      stationFigure.set(station.name, station);
    }
    const allStations = Array.from(stationFigure.values());

    const yamanoteEdges = [];
    for (let i = 0; i < N; i++) {
      const j = (i+1) % N;

    function addStationsAndEdges(stationData) {
      const newEdges = [];

      for (const stationInfo of stationData) {
        // 始点の駅を取得
        const startStation = stationFigure.get(stationInfo.start);
        // 支店の駅がなかった場合次の駅へ
        if (!startStation) {
          console.error(`始点駅 "${stationInfo.start}" が見つかりません。`);
          continue; 
        }

        // 新しい駅を作成する用
        const newStation = {
          id: newId,
          name: stationInfo.name,
          x: startStation.x + stationInfo.dx,
          y: startStation.y + stationInfo.dy,
          angle: null,
        };

        // allStationsに新しい駅を追加
        allStations.push(newStation);
        stationFigure.set(newStation.name, newStation);

        // 新しい頂点を作成
        newEdges.push({
          from: startStation.id,
          to: newStation.id,
          active: false,
          color: defaultColor,
          activeColor: activeColor
        });

        // 次の駅のためにIDを+
        newId++;
      }
      return newEdges;

/// 既存駅を繋ぐやつ

    connectStations("北戸田","武蔵浦和","#808080","#d33");
    connectStations("北与野","大宮","#808080","#d33");
    connectStations("南千住","北千住","#808080","#d33");
    connectStations("分倍河原","府中本町","#808080","#d33");
    connectStations("尻手","川崎","#808080","#d33");
    connectStations("下総中山","西船橋","#808080","#d33");



    // 描画
    function draw() {
      ctx.save();
      ctx.clearRect(0,0,W,H);
      ctx.setTransform(scale, 0, 0, scale, defaultX, defaultY);

      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.strokeStyle = "#e0e0e0";
      ctx.lineWidth = 2;
      ctx.stroke();

      allEdges.forEach(e => {
        const a = allStations[e.from], b = allStations[e.to];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        // --- 変更点ここから ---
        if (e === pendingRangeStartEdge) {
          // 範囲選択の始点として選択中の場合、目立つ色（シアンなど）にする
          ctx.strokeStyle = "#00ffff"; 
        } else {
          // 通常の判定
          ctx.strokeStyle = e.active ? e.activeColor : e.color;
        }
        // --- 変更点ここまで ---
        ctx.stroke();
      });

      allStations.forEach(s => {
        ctx.beginPath();
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.arc(s.x, s.y, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
      });

      ctx.font = "12px system-ui, sans-serif";
      ctx.fillStyle = "#111";
      ctx.textBaseline = "middle";
      
      allStations.forEach(s => {
        if (s.angle !== null) {
          const label = polar(s.angle, labelR);
          const deg = ((s.angle*180/Math.PI)+360)%360;
          if (deg > 90 && deg < 270) {
            ctx.textAlign = "right";
          } else {
            ctx.textAlign = "left";
          }
          ctx.fillText(s.name, label.x, label.y);
        } else {
          ctx.textAlign = "center";
          ctx.fillText(s.name, s.x, s.y - 15);
        }
      });

      document.getElementById("count").textContent = allEdges.filter(e=>e.active).length;
      document.getElementById("total").textContent = allEdges.length;

      ctx.restore();
    }

    // クリック判定
    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const vx = x2 - x1, vy = y2 - y1;
      const wx = px - x1, wy = py - y1;
      const c1 = vx*wx + vy*wy;
      if (c1 <= 0) return Math.hypot(px - x1, py - y1);
      const c2 = vx*vx + vy*vy;
      if (c2 <= c1) return Math.hypot(px - x2, py - y2);
      const t = c1 / c2;
      const projx = x1 + t*vx, projy = y1 + t*vy;
      return Math.hypot(px - projx, py - projy);
    }

    // イベントハンドラ
    function screenToWorld(sx, sy) {
      return { x: (sx - defaultX) / scale, y: (sy - defaultY) / scale };
    }

    canvas.addEventListener("click", (ev) => {
      if (didDrag) {
        didDrag = false;
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const world = screenToWorld(screenX, screenY);
      let bestEdge = null;
      let bestDist = Infinity;
      allEdges.forEach((e) => {
        const a = allStations[e.from], b = allStations[e.to];
        const d = pointToSegmentDistance(world.x, world.y, a.x, a.y, b.x, b.y);
        if (d < bestDist) {
          bestDist = d;
          bestEdge = e;
        }
      });
      if (bestEdge && (bestDist * scale) <= 12) {
        bestEdge.active = !bestEdge.active;
        draw();
      }
    });

    canvas.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const worldBefore = screenToWorld(screenX, screenY);
      const zoomFactor = 1.1;
      let newScale = (ev.deltaY < 0) ? (scale * zoomFactor) : (scale / zoomFactor);
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const newX = screenX - worldBefore.x * newScale;
      const newY = screenY - worldBefore.y * newScale;
      scale = newScale;
      defaultX = newX;
      defaultY = newY;
      draw();
    });

    canvas.addEventListener("mousedown", (ev) => {
      nowDrag = true;
      didDrag = false;
      lastX = ev.clientX;
      lastY = ev.clientY;
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener("mousemove", (ev) => {
      if (!nowDrag) return;
      ev.preventDefault();
      didDrag = true;
      const dx = ev.clientX - lastX;
      const dy = ev.clientY - lastY;
      defaultX += dx;
      defaultY += dy;
      lastX = ev.clientX;
      lastY = ev.clientY;
      draw();
    });

    canvas.addEventListener("mouseup", (ev) => {
      nowDrag = false;
      canvas.style.cursor = 'pointer';
    });

    canvas.addEventListener("mouseleave", (ev) => {
      nowDrag = false;
      canvas.style.cursor = 'pointer';
    });

//保存/読込/全解除 の直前あたりにコピペ（開始）
// --- 範囲選択用ロジック ---

    let pendingRangeStartEdge = null; // 1回目の右クリックで選んだ辺

    // グラフ構造（隣接リスト）を作成する関数
    function buildAdjacencyList() {
      const adj = new Map();
      // 全ての駅に対して空のリストを初期化
      allStations.forEach(s => adj.set(s.id, []));
      // 辺の情報を詰める
      allEdges.forEach(edge => {
        adj.get(edge.from).push({ to: edge.to, edgeObj: edge });
        adj.get(edge.to).push({ to: edge.from, edgeObj: edge });
      });
      return adj;
    }

    // 幅優先探索(BFS)で2つの辺の間の最短ルートにある辺のリストを返す
    function findPathBetweenEdges(edgeA, edgeB) {
      if (edgeA === edgeB) return [edgeA];

      const adj = buildAdjacencyList();
      
      // 辺Aの両端(startNodes)から、辺Bの両端(goalNodes)への最短経路を探す
      // 4パターン(from->from, from->to, to->from, to->to)のうち最短を採用するイメージ
      const startNodes = [edgeA.from, edgeA.to];
      const goalNodes = new Set([edgeB.from, edgeB.to]);

      let bestPath = null;

      // 各始点候補から探索
      for (const startNode of startNodes) {
        const queue = [{ node: startNode, path: [] }];
        const visited = new Set([startNode]);

        while (queue.length > 0) {
          const { node, path } = queue.shift();

          // ゴールのいずれかの駅に到達したら
          if (goalNodes.has(node)) {
            // 今回見つかったパスに、始点のエッジと終点のエッジを足したものが答えの候補
            // (ただし、始点・終点がパスに含まれているかどうかの重複排除が必要だが、
            //  単純に可視化するだけならSetで重複を消せばOK)
            const fullPath = [edgeA, ...path, edgeB];
            
            // これがこれまでで最短なら採用
            if (!bestPath || fullPath.length < bestPath.length) {
              bestPath = fullPath;
            }
            // BFSなので最初に見つかったものがこのstartNodeからの一番短いルート。
            // 他のstartNodeからのルートと比較するためにbreakして次のforへ
            break; 
          }

          // 隣接ノードへ
          const neighbors = adj.get(node) || [];
          for (const next of neighbors) {
            if (!visited.has(next.to)) {
              visited.add(next.to);
              queue.push({ 
                node: next.to, 
                path: [...path, next.edgeObj] 
              });
            }
          }
        }
      }
      return bestPath || [];
    }

    // 右クリックイベント (contextmenu)
    canvas.addEventListener("contextmenu", (ev) => {
      ev.preventDefault(); // ブラウザの右クリックメニューを出さない

      const rect = canvas.getBoundingClientRect();
      const screenX = ev.clientX - rect.left;
      const screenY = ev.clientY - rect.top;
      const world = screenToWorld(screenX, screenY);

      // 一番近い辺を探す（クリック判定と同じロジック）
      let bestEdge = null;
      let bestDist = Infinity;
      allEdges.forEach((e) => {
        const a = allStations[e.from], b = allStations[e.to];
        const d = pointToSegmentDistance(world.x, world.y, a.x, a.y, b.x, b.y);
        if (d < bestDist) {
          bestDist = d;
          bestEdge = e;
        }
      });

      // 判定距離内であれば処理
      if (bestEdge && (bestDist * scale) <= 12) {
        
        if (pendingRangeStartEdge === null) {
          // --- 1回目の右クリック ---
          pendingRangeStartEdge = bestEdge;
          draw(); // 色を変えるために再描画
        } else {
          // --- 2回目の右クリック ---
          const pathEdges = findPathBetweenEdges(pendingRangeStartEdge, bestEdge);
          
          if (pathEdges.length > 0) {
            // パス上の辺をすべてアクティブ(塗る)にする
            pathEdges.forEach(e => e.active = true);
          } else {
            alert("経路が見つかりませんでした（線が繋がっていない可能性があります）");
          }

          // 状態リセット
          pendingRangeStartEdge = null;
          draw();
        }
      } else {
        // 何もないところを右クリックしたらキャンセル
        if (pendingRangeStartEdge) {
          pendingRangeStartEdge = null;
          draw();
        }
      }
    });

//保存/読込/全解除 






    // 保存/読込/全解除
    const STORAGE_KEY = "yamanote_chuo_edges_state_v2"; 
    document.getElementById("saveBtn").onclick = () => {
      const state = allEdges.map(e => e.active ? 1 : 0);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      alert("保存しました。");
    };
    document.getElementById("loadBtn").onclick = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { alert("保存データがありません。"); return; }
      try {
        const state = JSON.parse(raw);
        if (state.length !== allEdges.length) {
          alert("データ形式が古いため読み込めません。");
          localStorage.removeItem(STORAGE_KEY);
          return;
        }
        allEdges.forEach((e, i) => { e.active = !!state[i]; });
        draw();
        alert("読み込みました。");
      } catch {
        alert("保存データの読み込みに失敗しました。");
      }
    };
    document.getElementById("clearBtn").onclick = () => {
      allEdges.forEach(e => e.active = false);
      draw();
    };
    document.getElementById("resetBtn").onclick = () => {
      scale = 1.0;
      defaultX = 0.0;
      defaultY = 0.0;
      draw();
    };

    // 初回描画
    draw();
  </script>
